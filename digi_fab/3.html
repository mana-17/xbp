<h3 style="color: #b0dcff;">作品のタイトル</h3><br>


<h3 style="color: #b0dcff;">作品の説明</h3><br>
デザイン⇨ハートにしてかわいらしいデザインにした。
取り付け部分⇨マスカラに取り付けられるように、丸いパーツを取り付けた。
持ち運びやすさ⇨キーホルダーのようにポーチにも取り付けられるよう、上に穴を付けた。


<h3 style="color: #b0dcff;">作ろうと思った理由</h3><br>
市販のまつ毛の束間を作るピンセットの課題<br>
・デザインが地味<br>
・持ち運ぶとかさばる<br>
・マスカラは持ってきたのに束かんを作るピンセットを忘れてしまうことも<br><br>

➡️マスカラやポーチに付けられて、デザインが可愛く持ち運びしやすいピンセットを作ろうと思った。<br><br><br>
